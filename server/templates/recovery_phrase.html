{{define "content"}}
<div class="auth">
  <div class="card auth-card auth-card-wide">
    <div class="auth-brand"><img class="brand-logo" src="/static/juice-logo.svg" alt="" width="30" height="33"> juice</div>
    <h1>Recovery phrase</h1>
    <p>Please save the following recovery phrase. It is the only way to recover your account if you lose your password. <strong>Never share it with anyone.</strong></p>

    {{template "_phrase_words" .Data}}

    <form class="stack" method="post" action="{{if .Data.Action}}{{.Data.Action}}{{else}}/recovery-phrase{{end}}">
      {{.CSRFField}}
      <label><input type="checkbox" name="understand" required> I understand this phrase is the only way to recover my account.</label>
      <button class="btn" type="submit">I've saved these — continue</button>
    </form>
  </div>
</div>
{{end}}
