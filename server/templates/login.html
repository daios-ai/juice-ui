{{define "content"}}
{{$tab := or .Data.Tab "signin"}}
<div class="auth">
  <div class="card auth-card">
    <div class="auth-brand"><img class="brand-logo" src="/static/juice-logo.svg" alt="" width="30" height="33"> juice</div>
    <p class="subtitle auth-subtitle">A terminal for callable actions.</p>

    {{if .Data.Error}}{{template "_error" .Data.Error}}{{end}}
    {{if .Data.Notice}}<div class="banner banner-info" role="status">{{.Data.Notice}}</div>{{end}}

    <div class="tabs" role="tablist">
      <a class="tab{{if eq $tab "signin"}} active{{end}}" href="/login?tab=signin" data-tab="signin" role="tab"{{if eq $tab "signin"}} aria-current="page"{{end}}>Sign in</a>
      <a class="tab{{if eq $tab "signup"}} active{{end}}" href="/login?tab=signup" data-tab="signup" role="tab"{{if eq $tab "signup"}} aria-current="page"{{end}}>Create account</a>
    </div>

    <form class="auth-panel stack" method="post" action="/login" data-panel="signin"{{if ne $tab "signin"}} hidden{{end}}>
      {{.CSRFField}}
      <div class="field">
        <label for="handle">Handle</label>
        <input id="handle" name="handle" type="text" placeholder="@you" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">Sign in</button>
    </form>

    <form class="auth-panel stack" method="post" action="/signup" data-panel="signup" data-confirm-password{{if ne $tab "signup"}} hidden{{end}}>
      {{.CSRFField}}
      <div class="field">
        <label for="c_handle">Handle</label>
        <input id="c_handle" name="handle" type="text" placeholder="@you" required>
      </div>
      <div class="field">
        <label for="c_email">Email</label>
        <input id="c_email" name="email" type="email" required>
      </div>
      <div class="field">
        <label for="c_password">Password</label>
        <input id="c_password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="c_password2">Confirm password</label>
        <input id="c_password2" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="btn" type="submit">Create account</button>
    </form>
  </div>
</div>
{{end}}
