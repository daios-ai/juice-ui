{{define "content"}}
{{$d := .Data}}
<div class="page-head"><h1>Rooms</h1></div>
<p><a class="btn-quiet" href="/chat/rooms?form=new" data-modal="form-new">+ new room</a></p>

{{if $d.Rooms}}
<div class="table-scroll">
<table>
  <thead><tr><th>room</th><th>members</th><th>last activity</th><th></th></tr></thead>
  <tbody>
  {{range $d.Rooms}}
  <tr class="rowable{{if .Unread}} unread{{end}}" tabindex="-1" data-href="/chat/room/{{.ID}}">
    <td><a href="/chat/room/{{.ID}}">{{.Name}}</a></td>
    <td>{{len .Members}}</td>
    <td class="muted">{{shortTime .LastAt}}</td>
    <td>{{if .Unread}}<span class="badge" aria-label="unread"></span>{{end}}</td>
  </tr>
  {{end}}
  </tbody>
</table>
</div>
{{end}}

<dialog id="form-new" class="modal-form"{{if $d.OpenForm}} open{{end}} aria-label="New room">
  <div class="modal-head"><h2>New room</h2><a class="modal-close" href="/chat/rooms" data-modal-close aria-label="Close">×</a></div>
  <div class="modal-body">
    <form class="stack" method="post" action="/chat/rooms">
      {{.CSRFField}}
      <div class="field">
        <label for="room-name">Name</label>
        <input id="room-name" type="text" name="name" required>
      </div>
      {{if $d.Agents}}
      <div class="field">
        <label>Agents</label>
        {{range $d.Agents}}<label class="check"><input type="checkbox" name="agent" value="{{.}}"> <span class="mono">{{.}}</span></label>{{end}}
      </div>
      {{end}}
      <div class="field">
        <label for="room-members">Members</label>
        <textarea id="room-members" name="members" rows="1" class="mono" placeholder="handle{{"@"}}kernel"></textarea>
      </div>
      <button class="btn" type="submit">Create</button>
    </form>
  </div>
</dialog>
{{end}}
